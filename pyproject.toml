[tool.poetry]
name = "shared-world"
version = "0.1.0"
description = "Local, containerized AI campaign management co-pilot for D&D (West Marches style) — world state tracking, entity extraction, and RAG over campaign lore."
authors = ["Matt DiPietro"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
langgraph = "^0.2"
langgraph-checkpoint-sqlite = "^2.0"
aiosqlite = "^0.20"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
pgvector = "^0.3"
pydantic = "^2.9"
pydantic-settings = "^2.5"
ollama = "^0.3"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
mkdocs-material = "^9.5"
ruff = "^0.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
