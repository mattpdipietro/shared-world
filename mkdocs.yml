site_name: Shared World — Campaign Engine
site_description: Local AI D&D campaign co-pilot — world state tracking, entity extraction, and RAG over campaign lore.
repo_url: https://github.com/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data Model: data-model.md
  - UI Mockups: mockups/index.md
  - Roadmap: roadmap.md
  - Setup: setup.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
